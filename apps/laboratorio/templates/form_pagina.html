{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
    <h1>{{ titulo }}</h1>
    <form method="POST" class="card form">
        {% csrf_token %}
        {% include 'includes/form.html' %}
        <div class="actions">
            <button type="submit" class="btn">Salvar</button>
            <a class="btn btn-light" href="{% url voltar %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
