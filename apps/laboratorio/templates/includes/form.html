{% if form.non_field_errors %}
    <p class="alert alert-error">{{ form.non_field_errors }}</p>
{% endif %}
{% for field in form %}
    <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
        {% for erro in field.errors %}<small class="erro">{{ erro }}</small>{% endfor %}
    </div>
{% endfor %}
