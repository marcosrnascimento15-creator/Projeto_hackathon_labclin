{% extends 'base-login.html' %}
{% block title %}Cadastrar{% endblock %}
{% block content %}
<h1>Criar conta</h1>
{% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}
<form action="" method="POST">
    {% csrf_token %}
    <label for="username">Novo usuário</label>
    <input type="text" name="username" id="username" value="{{ username|default:'' }}" required>
    <label for="email">E-mail</label>
    <input type="email" name="email" id="email" value="{{ email|default:'' }}">
    <label for="password">Senha</label>
    <input type="password" name="password" id="password" required>
    <label for="confirm_password">Confirme a senha</label>
    <input type="password" name="confirm_password" id="confirm_password" required>
    <button type="submit" class="btn">Cadastrar</button>
</form>
<p class="auth-link">Já tem uma conta? <a href="{% url 'login' %}">Faça login.</a></p>
{% endblock %}
